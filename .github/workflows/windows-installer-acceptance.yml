name: Windows installer acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable draft tag (vX.Y.Z)"
        required: true
        type: string
      source_commit:
        description: "Exact release build commit"
        required: true
        type: string
      setup_sha256:
        description: "Local full installer SHA-256"
        required: true
        type: string
      update_sha256:
        description: "Local update JSON SHA-256"
        required: true
        type: string
      target_inventory_sha256:
        description: "Local build ownership inventory SHA-256"
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    name: Fresh install, upgrade, and uninstall
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # GitHub requires write access to read unpublished release assets.
      contents: write
    steps:
      - name: Check out the acceptance workflow scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Authenticate the draft and published baselines
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source_commit }}
          RELEASE_SETUP_SHA256: ${{ inputs.setup_sha256 }}
          RELEASE_UPDATE_SHA256: ${{ inputs.update_sha256 }}
          RELEASE_INVENTORY_SHA256: ${{ inputs.target_inventory_sha256 }}
        run: |
          ./scripts/check_release_draft.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG `
            -SourceCommit $env:RELEASE_SOURCE -SetupSha256 $env:RELEASE_SETUP_SHA256 `
            -UpdateSha256 $env:RELEASE_UPDATE_SHA256 -TargetInventorySha256 $env:RELEASE_INVENTORY_SHA256 `
            -DownloadDir (Join-Path $env:RUNNER_TEMP 'studio-release-assets') `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'studio-acceptance')
      - name: Check out the exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the inventory check dependency
        run: python -m pip install "packaging>=24,<27"
      - name: Verify the Windows installer lifecycle and packaged Studio
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'studio-acceptance'
          ./scripts/check_release_installer.ps1 -SourceRoot release-source `
            -ReceiptPath (Join-Path $evidence 'release-assets.json') -EvidenceDir $evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-installer-acceptance
          path: ${{ runner.temp }}/studio-acceptance
          retention-days: 14
