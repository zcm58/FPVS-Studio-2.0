[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fpvs-studio"
version = "2.4.2"
description = "FPVS Studio in beta release."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Zack Murphy" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0",
  "packaging>=24,<26",
  "pillow>=11.3,<12",
  "pyserial>=3.5,<4.0",
  "PySide6>=6.11.2,<7.0",
  "pydantic>=2.8,<3.0",
  "cryptography>=50.0,<51.0",
  "keyring>=25,<26; sys_platform == 'linux'",
  "secretstorage>=3.3,<4; sys_platform == 'linux'",
]

[project.optional-dependencies]
engine = [
  "psychopy>=2024.2,<2027.0",
  "sounddevice>=0.4,<0.6",
  # Security floors for dependencies already required by PsychoPy.
  "GitPython>=3.1.60,<4.0",
  "requests>=2.33.0,<3.0",
  "urllib3>=2.8.0,<3.0",
  "idna>=3.15,<4.0",
  "msgpack>=1.2.1,<2.0",
  "soupsieve>=2.9.0,<3.0",
  "ujson>=5.13.0,<6.0",
]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-qt>=4.4,<5.0",
  "pytest-timeout>=2.3,<3.0",
  "PyYAML>=6.0,<7.0",
  "ruff>=0.6,<1.0",
]
packaging = [
  "pyinstaller>=6,<7",
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.7.7,<10.0",
  "Pygments>=2.20.0,<3.0",
  "pymdown-extensions>=11.0.1,<12.0",
]

[project.scripts]
fpvs-studio = "fpvs_studio.app.main:main"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib --timeout=30 --timeout-method=thread -p no:cacheprovider -p no:pytest-qt"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "qt: requires an explicitly approved visible Qt environment",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/references/archive"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/fpvs_studio"]
